{% extends "base_admin.html" %}
{% block page_title %}Paramètres du site{% endblock %}

{% block admin_content %}
<div class="jci-card p-4">
  <form method="post" class="row g-3">
    {% csrf_token %}
    {% for field in form %}
      <div class="col-md-6">
        <label for="{{ field.id_for_label }}" class="form-label small fw-semibold">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
        {% endif %}
      </div>
    {% endfor %}
    <div class="col-12 d-flex justify-content-end pt-3 border-top">
      <button type="submit" class="btn btn-jci-primary btn-sm px-4">Enregistrer les paramètres</button>
    </div>
  </form>
</div>
{% endblock %}
