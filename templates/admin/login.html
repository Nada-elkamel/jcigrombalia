{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion Administrateur — JCI Grombalia</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="{% static 'css/jci_theme.css' %}" rel="stylesheet" />
  </head>
  <body class="bg-jci-surface d-flex align-items-center min-vh-100 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">
          <div class="jci-card p-4 p-sm-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <img src="{% static 'images/jci_grombalia_logo.jpg' %}" alt="Logo JCI Grombalia" height="40" />
              <a href="{% url 'core:home' %}" class="small text-muted text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Retour au site
              </a>
            </div>

            <div class="small fw-semibold text-jci-cyan mb-1">
              <i class="bi bi-lock me-1"></i> Accès réservé
            </div>
            <h1 class="h4 fw-bold mb-2">Connexion Administrateur</h1>
            <p class="small text-muted mb-4">
              Connectez-vous avec votre compte administrateur unique.
            </p>

            {% if error_message %}
              <div class="alert alert-danger small py-2">{{ error_message }}</div>
            {% endif %}

            <form method="post">
              {% csrf_token %}
              <div class="mb-3">
                <label for="id_identifier" class="form-label small fw-semibold">Nom d'utilisateur ou e-mail</label>
                <input type="text" id="id_identifier" name="identifier" value="{{ identifier_value }}" required class="form-control" autocomplete="username" />
              </div>
              <div class="mb-4">
                <label for="id_password" class="form-label small fw-semibold">Mot de passe</label>
                <input type="password" id="id_password" name="password" required class="form-control" autocomplete="current-password" />
              </div>
              <button type="submit" class="btn btn-jci-primary w-100 py-2">Se connecter</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
